<!DOCTYPE html>  
<html lang="ar" dir="rtl">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>المختبر العملي الدقيق للتحلل الإشعاعي</title>  
    <style>  
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }  
        body { background-color: #0f172a; color: #f8fafc; padding: 1.5rem; display: flex; flex-direction: column; min-height: 100vh; }  
        header { text-align: center; margin-bottom: 1.2rem; }  
        h1 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 0.3rem; }  
        p.subtitle { color: #94a3b8; font-size: 0.9rem; }  
          
        .container { max-width: 1000px; margin: 0 auto; width: 100%; display: grid; grid-template-columns: 1.2fr 1.5fr; gap: 1rem; }  
        @media(max-width: 768px) { .container { grid-template-columns: 1fr; } }  
  
        .card { background-color: #1e293b; border-radius: 12px; padding: 1.2rem; border: 1px solid #334155; }  
        label { display: block; color: #cbd5e1; font-size: 0.9rem; margin-bottom: 0.4rem; font-weight: bold; }  
        select, input, button { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: #fff; font-size: 1rem; margin-bottom: 0.8rem; outline: none; }  
        select:focus, input:focus { border-color: #38bdf8; }  
          
        button.btn-action { background: linear-gradient(135deg, #0284c7, #2563eb); border: none; font-weight: bold; cursor: pointer; transition: all 0.2s; margin-top: 0.5rem; }  
        button.btn-action:hover { background: linear-gradient(135deg, #0369a1, #1d4ed8); }  
  
        #canvas-container { width: 100%; height: 320px; background-color: #050b14; border-radius: 8px; position: relative; border: 1px solid #334155; overflow: hidden; }  
          
        .info-panel { background: #0f172a; padding: 1rem; border-radius: 8px; border: 1px solid #334155; margin-top: 0.5rem; font-size: 0.9rem; line-height: 1.6; }  
        .observation-prompt { color: #f59e0b; font-weight: bold; margin-top: 0.5rem; text-align: center; font-size: 0.95rem; }  
  
        .equation-view { font-size: 1.1rem; font-weight: bold; direction: ltr; background: #1e293b; padding: 10px; border-radius: 6px; text-align: center; margin: 0.8rem 0; }  
        .eq-input { width: 55px; text-align: center; padding: 0.3rem; font-size: 1rem; display: inline-block; margin: 0 3px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 4px; }  
          
        .result-box { padding: 0.8rem; border-radius: 6px; font-size: 0.9rem; margin-top: 0.5rem; text-align: center; display: none; }  
        .result-box.success { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }  
        .result-box.error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }  
          
        footer { text-align: center; padding: 1rem; color: #64748b; font-size: 0.85rem; margin-top: auto; width: 100%; }  
    </style>  
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>  
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>  
</head>  
<body>  
  
    <header>  
        <h1>🧪 المختبر العملي الدقيق للتحلل الإشعاعي</h1>  
        <p class="subtitle">محاكاة متوافقة تماماً مع نوع التحلل والعنصر المختار</p>  
    </header>  
  
    <div class="container">  
        <div class="card">  
            <label for="element-select">العنصر المختار:</label>  
            <select id="element-select">  
                <option value="Ra226" selected>الراديوم-226 (Ra-226) - يتحلل بألفا</option>  
                <option value="U238">اليورانيوم-238 (U-238) - يتحلل بألفا</option>  
                <option value="C14">الكربون-14 (C-14) - يتحلل بيتا</option>  
                <option value="I131">اليود-131 (I-131) - يتحلل بيتا</option>  
            </select>  
  
            <label for="decay-select">نوع التحلل:</label>  
            <select id="decay-select">  
                <option value="alpha">تحلل ألفا (α)</option>  
                <option value="beta">تحلل بيتا (β)</option>  
                <option value="gamma">تحلل غاما (γ)</option>  
            </select>  
  
            <div class="info-panel" id="element-details"></div>  
  
            <button class="btn-action" id="btn-trigger">👁️ اضغطي لبدء محاكاة هذا التحلل</button>  
        </div>  
  
        <div class="card" style="display: flex; flex-direction: column;">  
            <div id="canvas-container"></div>  
            <div class="observation-prompt" id="obs-text">النواة جاهزة. راقبي التفاعل الحقيقي حسب نوع الإشعاع.</div>  
        </div>  
    </div>  
  
    <div class="card" style="max-width: 1000px; margin: 1rem auto 0; width: 100%;">  
        <h3 style="color: #38bdf8; margin-bottom: 0.5rem; font-size: 1rem;">✍️ اكتبي المعادلة النووية بناءً على ملاحظتك:</h3>  
          
        <div class="equation-view">  
            <span id="eq-parent"><sup>226</sup><sub>88</sub>Ra</span> →   
            <span><sup><input type="number" class="eq-input" id="user-m" placeholder="كتلي"></sup><sub><input type="number" class="eq-input" id="user-z" placeholder="ذري"></sub><span id="eq-daughter">Rn</span></span> +   
            <span id="eq-particle"><sup>4</sup><sub>2</sub>He</span>  
        </div>  
  
        <button class="btn-action" style="background: #16a34a; max-width: 250px; margin: 0 auto; display: block;" id="btn-check">تحقق من استنتاجي</button>  
        <div id="quiz-result" class="result-box"></div>  
    </div>  
  
    <footer>تطبيق كيمياء التحلل الإشعاعي</footer>  
  
    <script>  
        const elementsData = {  
            Ra226: { name: 'الراديوم', symbol: 'Ra', z: 88, a: 226, dSym: 'Rn', dZ: 86, dA: 222 },  
            U238: { name: 'اليورانيوم', symbol: 'U', z: 92, a: 238, dSym: 'Th', dZ: 90, dA: 234 },  
            C14: { name: 'الكربون', symbol: 'C', z: 6, a: 14, dSym: 'N', dZ: 7, dA: 14 },  
            I131: { name: 'اليود', symbol: 'I', z: 53, a: 131, dSym: 'Xe', dZ: 54, dA: 131 }  
        };  
  
        let scene, camera, renderer, controls;  
        let nucleusGroup, emittedGroup;  
        let isAnimating = false;  
  
        function init3D() {  
            const container = document.getElementById('canvas-container');  
            scene = new THREE.Scene();  
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);  
            camera.position.set(0, 0, 14);  
  
            renderer = new THREE.WebGLRenderer({ antialias: true });  
            renderer.setSize(container.clientWidth, container.clientHeight);  
            renderer.setPixelRatio(window.devicePixelRatio);  
            container.appendChild(renderer.domElement);  
  
            controls = new THREE.OrbitControls(camera, renderer.domElement);  
            controls.enableDamping = true;  
  
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));  
            const pointLight = new THREE.PointLight(0xffffff, 1.2);  
            pointLight.position.set(10, 10, 10);  
            scene.add(pointLight);  
  
            nucleusGroup = new THREE.Group();  
            emittedGroup = new THREE.Group();  
            scene.add(nucleusGroup);  
            scene.add(emittedGroup);  
  
            setupElement();  
            animate();  
        }  
  
        function setupElement() {  
            while(nucleusGroup.children.length > 0) nucleusGroup.remove(nucleusGroup.children[0]);  
            while(emittedGroup.children.length > 0) emittedGroup.remove(emittedGroup.children[0]);  
            isAnimating = false;  
  
            const key = document.getElementById('element-select').value;  
            const el = elementsData[key];  
            const decay = document.getElementById('decay-select').value;  
  
            document.getElementById('element-details').innerHTML = `  
                <strong style="color: #38bdf8;">${el.name} (${el.symbol})</strong><br>  
                • العدد الكتلي الأصلي: <b>${el.a}</b><br>  
                • العدد الذري الأصلي: <b>${el.z}</b>  
            `;  
  
            const totalSpheres = 35;  
            const pRatio = el.z / el.a;  
            const pGeo = new THREE.SphereGeometry(0.35, 16, 16);  
            const nGeo = new THREE.SphereGeometry(0.35, 16, 16);  
            const pMat = new THREE.MeshPhongMaterial({ color: 0xef4444 });  
            const nMat = new THREE.MeshPhongMaterial({ color: 0x3b82f6 });  
  
            for (let i = 0; i < totalSpheres; i++) {  
                const isProton = Math.random() < pRatio;  
                const mesh = new THREE.Mesh(isProton ? pGeo : nGeo, isProton ? pMat : nMat);  
                const phi = Math.acos(-1 + (2 * i) / totalSpheres);  
                const theta = Math.sqrt(totalSpheres * Math.PI) * phi;  
                const r = 1.4 * (0.4 + 0.6 * Math.random());  
                mesh.position.set(r * Math.cos(theta) * Math.sin(phi), r * Math.sin(theta) * Math.sin(phi), r * Math.cos(phi));  
                nucleusGroup.add(mesh);  
            }  
  
            document.getElementById('eq-parent').innerHTML = `<sup>${el.a}</sup><sub>${el.z}</sub>${el.symbol}`;  
            document.getElementById('eq-daughter').innerText = el.dSym;  
              
            if(decay === 'alpha') {  
                document.getElementById('eq-particle').innerHTML = `<sup>4</sup><sub>2</sub>He`;  
            } else if(decay === 'beta') {  
                document.getElementById('eq-particle').innerHTML = `<sup>0</sup><sub>-1</sub>e`;  
            } else {  
                document.getElementById('eq-particle').innerHTML = `<sup>0</sup><sub>0</sub>γ`;  
            }  
  
            document.getElementById('user-m').value = '';  
            document.getElementById('user-z').value = '';  
            document.getElementById('quiz-result').style.display = 'none';  
            document.getElementById('obs-text').innerText = `النواة مستقرة. اضغطي الزر لمشاهدة تفاعل (${decay}) بدقة.`;  
        }  
  
        function triggerObservation() {  
            if(isAnimating) return;  
            isAnimating = true;  
  
            const decay = document.getElementById('decay-select').value;  
            while(emittedGroup.children.length > 0) emittedGroup.remove(emittedGroup.children[0]);  
  
            if(decay === 'alpha') {  
                document.getElementById('obs-text').innerText = `👁️ تحلل ألفا: تطير مجموعة من 4 كرات (2 بروتون و2 نيوترون) معاً ببطء...`;  
                const alphaGroup = new THREE.Group();  
                const sGeo = new THREE.SphereGeometry(0.25, 16, 16);  
                const pMat = new THREE.MeshPhongMaterial({ color: 0xef4444 });  
                const nMat = new THREE.MeshPhongMaterial({ color: 0x3b82f6 });  
                alphaGroup.add(new THREE.Mesh(sGeo, pMat), new THREE.Mesh(sGeo, pMat), new THREE.Mesh(sGeo, nMat), new THREE.Mesh(sGeo, nMat));  
                alphaGroup.children[0].position.set(0.2, 0.2, 0);  
                alphaGroup.children[1].position.set(-0.2, -0.2, 0);  
                alphaGroup.children[2].position.set(-0.2, 0.2, 0);  
                alphaGroup.children[3].position.set(0.2, -0.2, 0);  
                emittedGroup.add(alphaGroup);  
  
                let frame = 0;  
                function anim() {  
                    if(frame < 60) {  
                        alphaGroup.position.x += 0.08;  
                        nucleusGroup.rotation.y += 0.02;  
                        frame++;  
                        requestAnimationFrame(anim);  
                    } else {  
                        document.getElementById('obs-text').innerText = `✨ لاحظي كم غادر واستنتجي التغير في العدد الكتلي والذري بنفسك!`;  
                    }  
                }  
                anim();  
            } else if(decay === 'beta') {  
                document.getElementById('obs-text').innerText = `👁️ تحلل بيتا: كرة زرقاء داخل النواة تتوهج وتتحول إلى حمراء (تحول نيوترون لبروتون) وانطلاق إلكترون صغير!`;  
                // تحويل لون إحدى الكرات في النواة للون الأحمر  
                if(nucleusGroup.children.length > 0) {  
                    nucleusGroup.children[0].material.color.setHex(0xef4444);  
                }  
                const betaRay = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffff00 }));  
                emittedGroup.add(betaRay);  
  
                let frame = 0;  
                function animBeta() {  
                    if(frame < 50) {  
                        betaRay.position.x += 0.12;  
                        frame++;  
                        requestAnimationFrame(animBeta);  
                    } else {  
                        document.getElementById('obs-text').innerText = `✨ لاحظي: نيوترون واحد أصبح بروتوناً (الكتلة ثابتة والذري زاد 1). اكتبيها بالأسفل!`;  
                    }  
                }  
                animBeta();  
            } else {  
                document.getElementById('obs-text').innerText = `👁️ تحلل غاما: النواة تهتز وتطلق وميض طاقة ضوئي دون أن تتغير مكوناتها أو كراتها!`;  
                const gammaRay = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshBasicMaterial({ color: 0x00ffff }));  
                emittedGroup.add(gammaRay);  
  
                let frame = 0;  
                function animGamma() {  
                    if(frame < 50) {  
                        gammaRay.position.x += 0.15;  
                        nucleusGroup.position.y = Math.sin(frame * 0.5) * 0.1;  
                        frame++;  
                        requestAnimationFrame(animGamma);  
                    } else {  
                        nucleusGroup.position.y = 0;  
                        document.getElementById('obs-text').innerText = `✨ لا تغيير في الكرات، الطاقة وحدها انبعثت. اكتبي النتيجة!`;  
                    }  
                }  
                animGamma();  
            }  
        }  
  
        function animate() {  
            requestAnimationFrame(animate);  
            if(!isAnimating) nucleusGroup.rotation.y += 0.002;  
            controls.update();  
            renderer.render(scene, camera);  
        }  
  
        document.getElementById('element-select').addEventListener('change', setupElement);  
        document.getElementById('decay-select').addEventListener('change', setupElement);  
        document.getElementById('btn-trigger').addEventListener('click', triggerObservation);  
  
        document.getElementById('btn-check').addEventListener('click', () => {  
            const key = document.getElementById('element-select').value;  
            const decay = document.getElementById('decay-select').value;  
            const el = elementsData[key];  
  
            let correctA = el.dA;  
            let correctZ = el.dZ;  
            if(decay === 'gamma') { correctA = el.a; correctZ = el.z; }  
            else if(decay === 'beta' && key === 'C14') { correctA = 14; correctZ = 7; }  
            else if(decay === 'beta' && key === 'I131') { correctA = 131; correctZ = 54; }  
  
            const userM = parseInt(document.getElementById('user-m').value);  
            const userZ = parseInt(document.getElementById('user-z').value);  
            const res = document.getElementById('quiz-result');  
            res.style.display = 'block';  
  
            if(userM === correctA && userZ === correctZ) {  
                res.className = 'result-box success';  
                res.innerText = `🎉 ممتاز جداً! استنتاجكِ صحيح 100% بناءً على ملاحظتكِ الحقيقية.`;  
            } else {  
                res.className = 'result-box error';  
                res.innerText = `❌ أعيدي مراجعة العد والملاحظة وجربي مجدداً!`;  
            }  
        });  
  
        window.onload = init3D;  
    </script>  
</body>  
</html>
